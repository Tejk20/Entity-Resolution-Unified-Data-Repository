name: entity-resolution

services:
  postgres:
    image: postgres:16-alpine
    container_name: er_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-er}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-er_password}
      POSTGRES_DB: ${POSTGRES_DB:-entity_resolution}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-er} -d ${POSTGRES_DB:-entity_resolution}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: er_redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: er_api
    # Local dev keeps the split topology (api / worker / beat as separate
    # containers). The image default (scripts/start.sh) is the consolidated
    # all-in-one entrypoint used by Render, so pin this service to API-only.
    command: ["bash", "scripts/start_api.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-er}:${POSTGRES_PASSWORD:-er_password}@postgres:5432/${POSTGRES_DB:-entity_resolution}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://localhost:8080"]'
      RUN_MIGRATIONS_ON_STARTUP: "true"
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: er_worker
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "ingest,resolve,default", "--prefetch-multiplier=1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-er}:${POSTGRES_PASSWORD:-er_password}@postgres:5432/${POSTGRES_DB:-entity_resolution}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$${HOSTNAME} --timeout 5"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: er_beat
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-er}:${POSTGRES_PASSWORD:-er_password}@postgres:5432/${POSTGRES_DB:-entity_resolution}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: er_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
