# render.yaml — Render Blueprint (free tier, NO Docker)
#
# Creates three resources, all in the ohio region so they can talk over
# Render's private network:
#   er-kv       Key Value (Valkey/Redis)  -> Celery broker + result backend + cache
#   er-database Postgres                  -> system of record
#   er-api      native Python web service -> FastAPI + Celery worker in one
#                                           process tree (backend/scripts/start.py)
#
# The service runs on Render's *native* Python runtime: `pip install -r
# requirements.txt` at build time and `python scripts/start.py` at run time.
# There is no Dockerfile, no shell entrypoint and no container image, so the
# build is just a pip install against the same requirements.txt used locally.
#
# Why one web service: the Free compute plan has no background-worker service
# type, and splitting the stack across services would break the local-filesystem
# assumptions (spool shards, uploaded files are read by the worker). One
# process tree keeps the whole backend in one place.
#
# Before the first sync, set CORS_ORIGINS to your deployed Vercel origin.

services:
  # --------------------------------------------------- celery broker / cache --
  - type: keyvalue
    name: er-kv
    region: ohio
    plan: free
    # Queue data must not be silently dropped when the 25 MB cap is hit.
    maxmemoryPolicy: noeviction
    # No public endpoint: only services in this workspace/region can reach it.
    ipAllowList: []

  # ------------------------------------------------------------------- api --
  - type: web
    name: er-api
    runtime: python
    rootDir: backend
    plan: free
    region: ohio
    # Native runtime: build installs deps, start runs the launcher that owns
    # migrations + celery worker + uvicorn.
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: python scripts/start.py
    healthCheckPath: /health
    envVars:
      # Pinned so Render does not jump to a brand-new CPython mid-deploy.
      # (backend/.python-version pins the same version as a fallback.)
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: er-database
          property: connectionString
      # All three Redis clients share db 0. Keyspaces do not collide: the app
      # caches under `search:*`, the broker under the `er` exchange/queue keys,
      # and results under `celery-task-meta-*` (expire after 24h). Splitting
      # them across db 0/1/2 is not possible here because a Blueprint cannot
      # append a database index to a referenced `connectionString`.
      - key: REDIS_URL
        fromService:
          name: er-kv
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: er-kv
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: er-kv
          type: keyvalue
          property: connectionString
      # The disk is ephemeral on the free tier, so uploads and the ingest spool
      # live in /tmp: they are transient by design (rows land in Postgres and
      # the shard directory is deleted when the job finishes).
      - key: UPLOAD_DIR
        value: /tmp/er-uploads
      # `solo` = one worker process executing tasks inline. Keeps the service
      # at two interpreters inside the 0.5 GB free-tier limit.
      - key: CELERY_POOL
        value: solo
      # Origins allowed to call the API from a browser. Update this whenever the
      # frontend moves (a Blueprint sync restarts the service with the value).
      - key: CORS_ORIGINS
        value: '["https://er-frontend-sigma.vercel.app","http://localhost:5173","http://127.0.0.1:5173","http://localhost:4173"]'
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      # Seeding dispatches Celery tasks and would race migrations on boot.
      - key: AUTO_SEED_ON_STARTUP
        value: "false"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"

databases:
  - name: er-database
    plan: free
    # Must match the web service region or the private-network lookup fails.
    region: ohio
