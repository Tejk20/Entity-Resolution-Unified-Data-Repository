# render.yaml — Render Blueprint (free tier)
# Auto-creates a single PostgreSQL instance and ONE web service that runs the
# FastAPI app, the Celery worker and the Celery beat scheduler as background
# processes inside the same container (see backend/scripts/start.sh).
#
# Why a single service: Render's free tier does not allow background workers as
# a separate service type, and splitting the stack across containers breaks
# local-filesystem assumptions (spool shards, uploads). One container keeps the
# whole backend in one place.

envVarGroups:
  - name: er-common
    envVars:
      # Upstash Redis (free tier): Console -> REST DB -> connect -> RESP URL (rediss://...)
      - key: REDIS_URL
        value: rediss://default:CHANGE_ME@your-upstash-host.upstash.io:6379
      - key: CELERY_BROKER_URL
        value: rediss://default:CHANGE_ME@your-upstash-host.upstash.io:6379/1
      - key: CELERY_RESULT_BACKEND
        value: rediss://default:CHANGE_ME@your-upstash-host.upstash.io:6379/2
      # Frontend origin(s). Set yours after creating the Vercel project.
      - key: CORS_ORIGINS
        value: '["https://YOUR_VERCEL_APP.vercel.app","http://localhost:5173"]'
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_SEED_ON_STARTUP
        value: "false"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"


databases:
  - name: er-database
    plan: free


services:
  # ------------------------------------------------------------- all-in-one --
  # API + Celery worker + Celery beat.
  - type: web
    name: er-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - fromGroup: er-common
      - key: DATABASE_URL
        fromDatabase:
          name: er-database
          property: connectionString