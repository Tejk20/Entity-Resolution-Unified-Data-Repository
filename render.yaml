# render.yaml — Render Blueprint (free tier)
# Auto-creates: PostgreSQL, API web service, Celery worker, Celery beat,
# and a keep-alive cron that pings /health every 10 min so the API never sleeps.


envVarGroups:
  - name: er-common
    envVars:
      # Upstash Redis (free tier): Console -> REST DB -> connect -> RESP URL (rediss://...)
      - key: REDIS_URL
        value: rediss://default:CHANGE_ME@your-upstash-host.upstash.io:6379
      - key: CELERY_BROKER_URL
        value: rediss://default:CHANGE_ME@your-upstash-host.upstash.io:6379/1
      - key: CELERY_RESULT_BACKEND
        value: rediss://default:CHANGE_ME@your-upstash-host.upstash.io:6379/2
      # Frontend origin(s). Set yours after creating the Vercel project.
      - key: CORS_ORIGINS
        value: '["https://YOUR_VERCEL_APP.vercel.app","http://localhost:5173","http://127.0.0.1:5173"]'
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_SEED_ON_STARTUP
        value: "false"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: UPLOAD_DIR
        value: /data/uploads


databases:
  - name: er-database
    plan: free


services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: er-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - fromGroup: er-common
      - key: APP_ROLE
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: er-database
          property: connectionString


  # ------------------------------------------------------------- worker ----
  - type: worker
    name: er-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    envVars:
      - fromGroup: er-common
      - key: APP_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: er-database
          property: connectionString


  # -------------------------------------------------------------- beat -----
  - type: worker
    name: er-beat
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    envVars:
      - fromGroup: er-common
      - key: APP_ROLE
        value: beat
      - key: DATABASE_URL
        fromDatabase:
          name: er-database
          property: connectionString